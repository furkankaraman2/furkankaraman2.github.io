name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for legacy Pages deployment for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          echo "Waiting for GitHub's automatic branch-based Pages run so it cannot overwrite the Vite deployment."
          seen=0
          for i in {1..72}; do
            state="$(gh api "/repos/$REPO/actions/runs?branch=main&event=dynamic&per_page=30"               --jq ".workflow_runs[] | select(.head_sha == \"$SHA\" and .name == \"pages build and deployment\") | .status"               | head -n 1)"
            if [ -n "$state" ]; then
              seen=1
              echo "Legacy Pages status: $state"
            fi
            if [ "$state" = "completed" ]; then
              echo "Legacy Pages run completed; safe to publish the verified Vite artifact."
              exit 0
            fi
            sleep 5
          done

          if [ "$seen" -eq 0 ]; then
            echo "No legacy Pages run was observed. Continuing with the Actions deployment."
            exit 0
          fi

          echo "Timed out while waiting for the legacy Pages run."
          exit 1

      - name: Deploy verified Vite artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production is serving the built app
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SHA: ${{ github.sha }}
        run: |
          for i in {1..18}; do
            html="$(curl -fsSL "${PAGE_URL}?deployment=${SHA}" || true)"
            if printf '%s' "$html" | grep -q '/assets/' && ! printf '%s' "$html" | grep -q '/src/main.jsx'; then
              echo "Production is serving the compiled Vite application."
              exit 0
            fi
            echo "Production has not switched to the compiled artifact yet; retrying..."
            sleep 5
          done

          echo "Production verification failed: the live page is not serving the compiled Vite artifact."
          exit 1
