<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="t d"><title id="t">L-histidine MOI-MS calibration</title><desc id="d">Vector rendering of the reported six-point external calibration with regression y equals 1505.6x minus 36145 and R squared 0.987.</desc><rect width="900" height="620" rx="28" fill="#fff"/><path d="M110 500H820M110 500V90" stroke="#183746" stroke-width="3"/><g stroke="#dce7e8" stroke-width="2"><path d="M110 420H820M110 340H820M110 260H820M110 180H820M110 100H820"/><path d="M250 90V500M390 90V500M530 90V500M670 90V500M810 90V500"/></g><path d="M128 470L810 112" stroke="#178a99" stroke-width="6"/><g fill="#43cad9" stroke="#0d5360" stroke-width="3"><circle cx="128" cy="470" r="9"/><circle cx="146" cy="460" r="9"/><circle cx="181" cy="442" r="9"/><circle cx="286" cy="387" r="9"/><circle cx="461" cy="295" r="9"/><circle cx="810" cy="112" r="9"/></g><text x="115" y="55" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#163b49">MOI-MS external calibration</text><text x="575" y="545" font-family="Arial,sans-serif" font-size="18" fill="#58727d">L-histidine concentration</text><text x="565" y="85" font-family="Arial,sans-serif" font-size="19" fill="#178a99">R² = 0.987</text><text x="565" y="112" font-family="Arial,sans-serif" font-size="16" fill="#58727d">y = 1505.6x − 36145</text></svg>